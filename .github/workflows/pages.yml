name: Refresh data and deploy
on:
  schedule:
    - cron: "*/30 * * * *"   # GitHub may delay or skip runs under load
  push:
    branches: [main]
    paths: [".github/workflows/pages.yml", "frontend/**"]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt python-dotenv requests pandas numpy
      - uses: actions/cache@v4
        with:
          path: data/external_cache
          key: worldcover-v200
      - name: Refresh NRT data
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: |
          python src/update_2026_nrt.py | tee out.txt
          if grep -q BLOCKED out.txt; then echo "::error::$(tr '\n' ' ' < out.txt)"; exit 1; fi
      - name: Commit new snapshot
        run: |
          git config user.name "thermoscope-bot"
          git config user.email "bot@users.noreply.github.com"
          for f in data/raw/firms_gujarat_2026.csv data/processed/gujarat_thermal_events_2026.csv data/processed/gujarat_event_evidence_2026.csv data/processed/gujarat_2026_inference.csv data/processed/gujarat_2026_inference_freshness.json; do [ -f $f ] && git add -f $f; done
          git diff --cached --quiet && exit 0
          git commit -qm "Auto-refresh 2026 snapshot"
          git pull -q --rebase --autostash 2>&1 || { echo "::error::pull failed: $(git pull --rebase --autostash 2>&1 | tr '\n' ' ')"; exit 1; }
          git push -q 2>&1 || { echo "::error::push failed: $(git push 2>&1 | tr '\n' ' ')"; exit 1; }
      - run: |
          mkdir _site && cp -r frontend _site/frontend && mkdir -p _site/data/processed
          cp data/processed/gujarat_2026_inference* _site/data/processed/
          echo '<meta http-equiv="refresh" content="0; url=frontend/">' > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: d
        uses: actions/deploy-pages@v4
